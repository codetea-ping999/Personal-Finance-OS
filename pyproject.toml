[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-finance-os"
version = "0.1.0"
description = "Explainable personal finance ledger, analytics, and scenario simulator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27,<1",
]

[project.scripts]
personal-finance-os = "personal_finance_os.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_finance_os"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

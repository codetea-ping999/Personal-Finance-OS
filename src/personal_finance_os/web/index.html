<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Personal Finance OS</title>
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color:#172033; background:#f4f7fb; }
    body { margin:0; }
    main { max-width:1100px; margin:0 auto; padding:32px 20px 64px; }
    header { display:flex; justify-content:space-between; align-items:end; gap:16px; margin-bottom:24px; }
    h1 { margin:0; font-size:32px; }
    .muted { color:#657087; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px; }
    .card { background:white; border:1px solid #e3e8f0; border-radius:16px; padding:18px; box-shadow:0 8px 25px rgba(31,45,61,.05); }
    .metric { font-size:27px; font-weight:750; margin-top:8px; }
    .wide { margin-top:14px; }
    form { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; align-items:end; }
    label { display:grid; gap:6px; font-size:13px; color:#59657a; }
    input, select, button { font:inherit; padding:10px 12px; border:1px solid #d7deea; border-radius:10px; background:white; }
    button { cursor:pointer; background:#172033; color:white; border-color:#172033; }
    pre { white-space:pre-wrap; background:#f7f9fc; padding:14px; border-radius:12px; overflow:auto; }
  </style>
</head>
<body>
<main>
  <header>
    <div><h1>Personal Finance OS</h1><div class="muted">Ledger → Metrics → Decisions</div></div>
    <button onclick="refresh()">更新</button>
  </header>

  <section class="grid">
    <div class="card"><div class="muted">純資産</div><div id="netWorth" class="metric">—</div></div>
    <div class="card"><div class="muted">収入</div><div id="income" class="metric">—</div></div>
    <div class="card"><div class="muted">支出</div><div id="expenses" class="metric">—</div></div>
    <div class="card"><div class="muted">Financial Health</div><div id="health" class="metric">—</div></div>
  </section>

  <section class="card wide">
    <h2>口座を追加</h2>
    <form id="accountForm">
      <label>名前<input name="name" required placeholder="生活口座" /></label>
      <label>種類<select name="account_type"><option value="bank">bank</option><option value="cash">cash</option><option value="investment">investment</option><option value="liability">liability</option></select></label>
      <label>開始残高<input name="opening_balance" type="number" value="0" /></label>
      <button>追加</button>
    </form>
  </section>

  <section class="card wide">
    <h2>購入 What-if</h2>
    <form id="scenarioForm">
      <label>購入価格<input name="price" type="number" min="1" value="300000" required /></label>
      <label>期間（月）<input name="horizon_months" type="number" min="1" value="60" /></label>
      <label>期待年利<input name="annual_return_rate" type="number" step="0.01" value="0.04" /></label>
      <button>試算</button>
    </form>
    <pre id="scenarioResult">購入判断をここに表示します。</pre>
  </section>
</main>
<script>
const yen = new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0});
async function refresh(){
  const r=await fetch('/api/summary'); const s=await r.json();
  netWorth.textContent=yen.format(s.net_worth); income.textContent=yen.format(s.income);
  expenses.textContent=yen.format(s.expenses); health.textContent=`${s.health_score} / 100`;
}
accountForm.addEventListener('submit',async e=>{e.preventDefault(); const f=new FormData(e.target); const body=Object.fromEntries(f); body.opening_balance=Number(body.opening_balance); await fetch('/api/accounts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); e.target.reset(); refresh();});
scenarioForm.addEventListener('submit',async e=>{e.preventDefault(); const f=new FormData(e.target); const body=Object.fromEntries(f); body.price=Number(body.price); body.horizon_months=Number(body.horizon_months); body.annual_return_rate=Number(body.annual_return_rate); const r=await fetch('/api/scenarios/purchase',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); const s=await r.json(); scenarioResult.textContent = r.ok ? `判定: ${s.verdict}\n購入可能度: ${s.affordability_score}/100\n購入後流動資産: ${yen.format(s.post_purchase_liquid_assets)}\n機会費用: ${yen.format(s.opportunity_cost)}\n${s.horizon_months}か月後の資産差を含めて定量評価しています。` : JSON.stringify(s,null,2);});
refresh();
</script>
</body>
</html>

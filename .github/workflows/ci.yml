name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Run the complete test suite with coverage
        run: python -m pytest --cov=personal_finance_os --cov-report=term-missing --cov-report=xml
      - name: Enforce total coverage
        run: python -m coverage report --fail-under=80
      - name: Enforce AI CFO coverage
        run: >-
          python -m coverage report
          --include="src/personal_finance_os/ai_cfo.py,src/personal_finance_os/ai_intents.py"
          --fail-under=90
